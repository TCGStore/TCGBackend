# Desarrollo local. Los microservicios se construyen desde los repos hermanos,
# así que todos deben estar clonados en la misma carpeta (ver README.md).
#
# Uso: cp .env.example .env && docker compose up -d
# Datos de prueba del catálogo: docker compose run --rm --entrypoint /app/seed catalog-service
# Stock inicial:                 docker compose run --rm inventory-service python -m inventory.seed

services:
  catalog-service:
    build: ../TCGCatalogService
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017
      MONGO_DB: catalog
    ports: ["50051:50051"]
    depends_on: [mongodb]

  users-service:
    build: ../TCGUserService
    environment:
      POSTGRES_CONNECTION: Host=postgres;Database=users;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports: ["50054:50054"]
    depends_on:
      postgres:
        condition: service_healthy

  inventory-service:
    build: ../TCGInventoryService
    environment:
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    ports: ["50053:50053"]
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  orders-service:
    build: ../TCGOrderService
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/orders
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      CATALOG_GRPC_TARGET: catalog-service:50051
    ports: ["50052:50052"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog-service:
        condition: service_started

  notifications-service:
    build: ../TCGNotificationService
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017
      MONGO_DB: notifications
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      ADMIN_ALERT_EMAILS: ${ADMIN_EMAIL}
    ports: ["50055:50055"]
    # The service exits when it loses RabbitMQ; this brings it back with a new connection.
    restart: on-failure
    depends_on:
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

  bff: # GraphQL para el frontend: http://localhost:4000/graphql
    build:
      context: . # needs proto/ at runtime
      dockerfile: bff/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET}
      CATALOG_GRPC_TARGET: catalog-service:50051
      ORDERS_GRPC_TARGET: orders-service:50052
      INVENTORY_GRPC_TARGET: inventory-service:50053
      USERS_GRPC_TARGET: users-service:50054
      NOTIFICATIONS_GRPC_TARGET: notifications-service:50055
      MCP_URL: http://mcp-server:4100
    ports: ["4000:4000"]
    depends_on:
      - mcp-server
      - catalog-service
      - orders-service
      - inventory-service
      - users-service
      - notifications-service

  mcp-server: # tools del agente: http://localhost:4100/mcp
    build:
      context: . # needs proto/ at runtime
      dockerfile: mcp-server/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET}
      CATALOG_GRPC_TARGET: catalog-service:50051
      ORDERS_GRPC_TARGET: orders-service:50052
      INVENTORY_GRPC_TARGET: inventory-service:50053
      USERS_GRPC_TARGET: users-service:50054
      NOTIFICATIONS_GRPC_TARGET: notifications-service:50055
    ports: ["4100:4100"]
    depends_on:
      - catalog-service
      - orders-service
      - inventory-service
      - users-service
      - notifications-service

  mongodb: # catalog-service y notifications-service (una base de datos cada uno)
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  postgres: # orders-service y users-service (una base de datos cada uno)
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis: # inventory-service
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"] # keeps stock across restarts
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  rabbitmq: # eventos entre orders, inventory y notifications
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"   # AMQP (lo usan los servicios)
      - "15672:15672" # panel web: http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      start_period: 120s # the first boot is slow
      interval: 5s
      retries: 10

  mailpit: # correo falso para notifications-service
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web para ver los correos: http://localhost:8025

volumes:
  mongo-data:
  postgres-data:
  redis-data:
