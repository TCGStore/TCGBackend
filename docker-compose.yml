# Desarrollo local. Cada servicio se agrega aquí cuando tiene su Dockerfile.
#
# Uso: cp .env.example .env && docker compose up -d
# Datos de prueba del catálogo: docker compose run --rm --entrypoint /app/seed catalog-service
# Stock inicial:                 docker compose run --rm inventory-service python -m inventory.seed

services:
  catalog-service:
    build: ./services/catalog-service
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017
      MONGO_DB: catalog
    ports: ["50051:50051"]
    depends_on: [mongodb]

  users-service:
    build:
      context: . # needs proto/ to compile
      dockerfile: services/users-service/Dockerfile
    environment:
      POSTGRES_CONNECTION: Host=postgres;Database=users;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports: ["50054:50054"]
    depends_on:
      postgres:
        condition: service_healthy

  inventory-service:
    build:
      context: . # needs proto/ to compile
      dockerfile: services/inventory-service/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    ports: ["50053:50053"]
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  orders-service:
    build:
      context: . # needs proto/ to compile
      dockerfile: services/orders-service/Dockerfile
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/orders
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      CATALOG_GRPC_TARGET: catalog-service:50051
    ports: ["50052:50052"]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog-service:
        condition: service_started

  mongodb: # catalog-service y notifications-service (una base de datos cada uno)
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  postgres: # orders-service y users-service (una base de datos cada uno)
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis: # inventory-service
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"] # keeps stock across restarts
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  rabbitmq: # eventos entre orders, inventory y notifications
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"   # AMQP (lo usan los servicios)
      - "15672:15672" # panel web: http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      start_period: 120s # the first boot is slow
      interval: 5s
      retries: 10

  mailpit: # correo falso para notifications-service
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web para ver los correos: http://localhost:8025

volumes:
  mongo-data:
  postgres-data:
  redis-data:
