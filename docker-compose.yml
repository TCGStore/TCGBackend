# Desarrollo local. Por ahora solo levanta la infraestructura;
# cada servicio se agregará aquí a medida que tenga su Dockerfile.
#
# Uso: cp .env.example .env && docker compose up -d

services:
  mongodb: # catalog-service
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  postgres: # orders-service
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]

  redis: # inventory-service
    image: redis:7
    ports: ["6379:6379"]

  rabbitmq: # eventos orders <-> inventory
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"   # AMQP (lo usan los servicios)
      - "15672:15672" # panel web: http://localhost:15672

volumes:
  mongo-data:
  postgres-data:
