# Desarrollo local. Cada servicio se agrega aquí cuando tiene su Dockerfile.
#
# Uso: cp .env.example .env && docker compose up -d
# Datos de prueba del catálogo: docker compose run --rm --entrypoint /app/seed catalog-service

services:
  catalog-service:
    build: ./services/catalog-service
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017
      MONGO_DB: catalog
    ports: ["50051:50051"]
    depends_on: [mongodb]

  users-service:
    build:
      context: . # needs proto/ to compile
      dockerfile: services/users-service/Dockerfile
    environment:
      POSTGRES_CONNECTION: Host=postgres;Database=users;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports: ["50054:50054"]
    depends_on:
      postgres:
        condition: service_healthy

  mongodb: # catalog-service y notifications-service (una base de datos cada uno)
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  postgres: # orders-service y users-service (una base de datos cada uno)
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis: # inventory-service
    image: redis:7
    ports: ["6379:6379"]

  rabbitmq: # eventos entre orders, inventory y notifications
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"   # AMQP (lo usan los servicios)
      - "15672:15672" # panel web: http://localhost:15672

  mailpit: # correo falso para notifications-service
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web para ver los correos: http://localhost:8025

volumes:
  mongo-data:
  postgres-data:
